version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bookmory_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookmory
      MYSQL_USER: matvey
      MYSQL_PASSWORD: 1311
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - bookmory_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: bookmory_php
    volumes:
      - ./src:/var/www/html
    networks:
      - bookmory_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: bookmory_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - bookmory_network
    depends_on:
      - app

  mysql-exporter: # Renamed for clarity with the original project
    image: quay.io/prometheus/mysqld-exporter # Using the quay.io image
    container_name: bookmory_mysql_exporter # Renamed to match original naming
    restart: unless-stopped
    command:
     # Use the username and password from the 'db' service
     - "--mysqld.username=matvey:1311"
     # Use the service name 'db' as the host on the Docker network
     - "--mysqld.address=db:3306" 
    networks:
      - bookmory_network
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: bookmory_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bookmory_network
    depends_on:
      - mysql-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: bookmory_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - bookmory_network
    depends_on:
      - prometheus

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  bookmory_network:
    driver: bridge

