global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bookmory-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['mysql-exporter:9104']
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: '/metrics'

